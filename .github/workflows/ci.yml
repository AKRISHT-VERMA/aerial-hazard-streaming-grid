name: CI

on:
  push:
    branches:
      - codex/complete-hazard-streaming-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hazard_test
          POSTGRES_USER: hazard_test
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hazard_test -d hazard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hazard_test:ci_only_password@127.0.0.1:5432/hazard_test
      RUN_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-postgres.txt
            requirements-browser-test.txt
      - name: Install runtime, database, test, and browser dependencies
        run: python -m pip install -r requirements-browser-test.txt -r requirements-postgres.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run unit, PostgreSQL integration, API, UDP, and browser smoke tests
        run: python -m unittest discover -v
